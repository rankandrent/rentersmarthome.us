name: Domain status

# One-off helper: prints the Cloudflare zone status, nameservers, DNS records and the Pages custom
# domain status for a site, using this repo's Cloudflare token.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain'
        required: true
        default: 'best-tripod.com'
      project:
        description: 'Cloudflare Pages project'
        required: true
        default: 'best-tripod'

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '62f912a0c185f2042615da812a6e62e6' }}
      DOMAIN: ${{ inputs.domain }}
      PROJECT: ${{ inputs.project }}
    steps:
      - name: Report
        run: |
          TOKEN=$(printf '%s' "$RAW_CF_TOKEN" | tr -d '[:space:]"'"'" | sed 's/^CLOUDFLARE_API_TOKEN=//')
          echo "::add-mask::$TOKEN"
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $TOKEN"
          echo "=== zone"
          Z=$(curl -s "$API/zones?name=$DOMAIN" -H "$AUTH")
          echo "$Z" | jq '.result[0] | {id, name, status, paused, name_servers, original_name_servers, activated_on}'
          ZID=$(echo "$Z" | jq -r '.result[0].id')
          echo "=== dns records"
          curl -s "$API/zones/$ZID/dns_records" -H "$AUTH" | jq '.result[] | {type, name, content, proxied}'
          echo "=== pages custom domains"
          curl -s "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" -H "$AUTH" | jq '.result | {name, subdomain, domains, latest_deployment: .latest_deployment.url, deployed: .latest_deployment.created_on}'
          for N in "$DOMAIN" "www.$DOMAIN"; do
            echo "=== pages domain $N"
            curl -s "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$N" -H "$AUTH" | jq '.result | {name, status, validation_data, verification_data, certificate_authority}'
          done
          echo "=== live check"
          for U in "https://$DOMAIN/blog/best-travel-tripod-for-mirrorless-camera/" "https://$PROJECT.pages.dev/blog/best-travel-tripod-for-mirrorless-camera/"; do
            printf '%s -> ' "$U"; curl -s -o /tmp/p.html -w '%{http_code} ' --max-time 20 "$U"; grep -o '<title>[^<]*' /tmp/p.html | head -1; echo "dp links: $(grep -o 'amazon.com/dp/B0' /tmp/p.html | wc -l)"
          done
