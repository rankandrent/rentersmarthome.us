name: Media probe

# One-off check of which media sources the agents can use from Actions:
# Cloudflare Workers AI image generation (with the existing Pages token) and
# YouTube oEmbed lookups. Prints status only, never the token.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '62f912a0c185f2042615da812a6e62e6' }}
    steps:
      - name: Workers AI text-to-image
        run: |
          TOKEN=$(printf '%s' "$RAW_CF_TOKEN" | tr -d '[:space:]"'"'" | sed 's/^CLOUDFLARE_API_TOKEN=//')
          for m in @cf/black-forest-labs/flux-1-schnell @cf/stabilityai/stable-diffusion-xl-base-1.0; do
            code=$(curl -s -o out.bin -w '%{http_code}' -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/$m" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d '{"prompt":"photo of a camera on a carbon fiber tripod on a windy beach at sunset, realistic"}')
            echo "$m -> HTTP $code, $(wc -c < out.bin) bytes"; head -c 300 out.bin | tr -cd '[:print:]'; echo
          done
      - name: YouTube oEmbed
        run: curl -s -o /dev/null -w 'oembed HTTP %{http_code}\n' 'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=sS1D5kj88A4&format=json'
