name: Search Console snapshot

# Daily per-page Search Console numbers for all three sites (data/gsc/<domain>/<date>.json), so
# scripts/trim-report.mjs can compare trimmed posts before and after (owner rule: concise and new).
# Runs before the daily publishing runs, so a post trimmed today has a baseline from today.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snapshot
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc-snapshot.mjs rentersmarthome.us best-tripod.com best-safe.com
      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain data/gsc)" ]; then echo "No changes."; exit 0; fi
          git config user.name "rentersmarthome-agents"
          git config user.email "agents@users.noreply.github.com"
          git add data/gsc
          git commit -m "data: Search Console snapshot [skip ci]"
          git pull --rebase
          git push
