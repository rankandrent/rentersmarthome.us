name: Google index check

# On request only (owner rule 2026-10-22: check only the posts the owner names, never the whole site):
# URL Inspection API for the given keywords/slugs/URLs plus a sitemap resubmit and WebSub ping. The run
# summary shows each page's status with a Search Console link to press "Request indexing".
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Keywords, slugs or URLs to check, comma separated'
        required: true

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit sitemaps
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/google-indexing.mjs --submit rentersmarthome.us best-tripod.com best-safe.com
      - name: Inspect URLs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          TARGETS: ${{ inputs.targets }}
        run: node scripts/google-indexing.mjs --check rentersmarthome.us best-tripod.com best-safe.com | tee check.log
      - name: Summary
        run: |
          { echo '### Index status'; echo '```'; cat check.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain data/index)" ]; then echo "No changes."; exit 0; fi
          git config user.name "rentersmarthome-agents"
          git config user.email "agents@users.noreply.github.com"
          git add data/index
          git commit -m "data: Google index check [skip ci]"
          git pull --rebase
          git push
