name: Google index check

# Daily: URL Inspection API for every blog URL of the three sites (data/index/<domain>.json) plus a
# sitemap resubmit and WebSub ping. The run summary lists pages Google has not indexed yet, each with
# a Search Console link to press "Request indexing" (Google has no API for that button).
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit sitemaps
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/google-indexing.mjs --submit rentersmarthome.us best-tripod.com best-safe.com
      - name: Inspect URLs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/google-indexing.mjs --check rentersmarthome.us best-tripod.com best-safe.com | tee check.log
      - name: Summary
        run: |
          { echo '### Pages Google has not indexed yet'; echo '```'; grep -E "indexed|NOT INDEXED" check.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain data/index)" ]; then echo "No changes."; exit 0; fi
          git config user.name "rentersmarthome-agents"
          git config user.email "agents@users.noreply.github.com"
          git add data/index
          git commit -m "data: Google index check [skip ci]"
          git pull --rebase
          git push
